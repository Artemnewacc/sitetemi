<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="Генератор идей для рилсов: нажми и получи тему, хук и формат видео для Instagram и TikTok.">
<title>Генератор идей для рилсов</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E">
<style>
html, body { background: #000000 !important; color: #ffffff; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<style>
:root {
  --bg: #000000;
  --text: #ffffff;
  --muted: #9a9a9a;
  --stat: #d8d8d8;
  --border: rgba(255, 255, 255, 0.16);
  --border-soft: rgba(255, 255, 255, 0.12);

  --logo: 15.5px;
  --logo-mark: 22px;
  --btn: 13.5px;
  --btn-h: 40px;
  --hero-btn-h: 46px;
  --h1: 48px;
  --lede: 15.5px;
  --badge: 12.5px;
  --stat-size: 13.5px;
  --header-y: 22px;
  --header-x: 40px;
  --stats-x: 72px;
  --stats-y: 36px;
  --hero-gap: 48px;
  --copy-max: 860px;
  --lede-max: 470px;
  --card-max: 620px;

  --sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", "Times New Roman", Times, serif;
}

html, body {
  background: #000000;
  background: var(--bg, #000000);
  color: #ffffff;
  color: var(--text, #ffffff);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  position: relative;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* ---------- Layers ---------- */
.grain {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0.07;
  mix-blend-mode: overlay;
}
.grain svg { width: 100%; height: 100%; display: block; }

.hero-photo {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #000;
  animation: in-photo 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.hero-photo video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hero-photo.is-in { animation: none; opacity: 1; transform: none; filter: none; }

.page {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ---------- Header ---------- */
.header {
  position: relative;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--header-y) var(--header-x) 10px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: var(--logo);
  font-weight: 600;
  letter-spacing: -0.03em;
  color: #fff;
}
.logo svg { width: var(--logo-mark); height: var(--logo-mark); flex: none; }
.logo-suffix { font-weight: 400; color: #cfcfcf; }
.header-tags {
  display: flex;
  gap: 8px;
}
.tag {
  display: inline-flex;
  align-items: center;
  height: 34px;
  padding: 0 14px;
  border-radius: 7px;
  border: 1px solid rgba(198, 198, 198, 0.55);
  background: linear-gradient(105deg, #050505 0%, #2a2a2a 48%, #4a4a4a 100%);
  color: #f3f3f3;
  font-size: 13px;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

/* ---------- Buttons ---------- */
.btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--btn-h);
  padding: 0 16px;
  border-radius: 6px;
  font-size: var(--btn);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, color 0.35s ease, filter 0.35s ease, transform 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.45) 48%, transparent 76%);
  transform: translateX(-130%);
  transition: transform 0.65s ease;
  pointer-events: none;
}
.btn:hover::after { transform: translateX(130%); }

.btn-solid {
  background: linear-gradient(180deg, #ffffff 0%, #e7e7e7 48%, #cfcfcf 100%);
  color: #111;
  border: 1px solid #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
}
.btn-solid:hover {
  background: linear-gradient(180deg, #ffffff 0%, #f3f6ff 42%, #d5def2 100%);
  border-color: #f2f6ff;
  box-shadow: inset 0 1px 0 #fff, 0 0 26px rgba(186, 208, 255, 0.4), 0 8px 18px rgba(255, 255, 255, 0.14);
}

.btn-ghost {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.5) 46%, rgba(150, 170, 200, 0.1));
  color: #fff;
  border: 1px solid rgba(198, 198, 198, 0.55);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.btn-ghost:hover {
  background: linear-gradient(135deg, rgba(210, 225, 255, 0.18), rgba(0, 0, 0, 0.35) 48%, rgba(180, 195, 220, 0.16));
  border-color: rgba(220, 230, 255, 0.8);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 24px rgba(170, 200, 255, 0.28);
}

.btn-gen { height: var(--hero-btn-h); padding: 0 24px; font-size: calc(var(--btn) + 1px); }
.btn-gen svg { width: 16px; height: 18px; flex: none; }
.btn-gen.spin svg { animation: spin-star 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

/* ---------- Hero ---------- */
.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 24px var(--hero-gap);
  min-height: 0;
}
.hero-copy {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: var(--copy-max);
  width: 100%;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  padding: 9px 15px;
  border-radius: 5px;
  background: linear-gradient(90deg, #7d7d7d 0%, #2a2a2a 52%, #0a0a0a 100%);
  color: #f2f2f2;
  font-size: var(--badge);
  letter-spacing: -0.01em;
}
.badge-star {
  width: 18px;
  height: 20px;
  flex: none;
  filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.45));
  animation: in-star 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
}

.hero h1 {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: var(--h1);
  font-weight: 500;
  letter-spacing: -0.045em;
  line-height: 1.12;
}
.headline-line {
  display: block;
  overflow: hidden;
  padding: 0.06em 0.15em 0.14em;
}
.headline-line > span { display: block; }
.hero h1 em {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 1.08em;
  letter-spacing: -0.03em;
  color: #9a9a9a;
  display: inline-block;
  animation: in-em 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.72s both;
}

.lede {
  max-width: var(--lede-max);
  margin-top: 16px;
  color: #9a9a9a;
  font-size: var(--lede);
  line-height: 1.55;
  letter-spacing: -0.015em;
}

.hero-actions {
  display: flex;
  justify-content: center;
  margin-top: 24px;
}

/* ---------- Idea card ---------- */
.idea {
  width: 100%;
  max-width: var(--card-max);
  margin-top: 22px;
  text-align: left;
  border-radius: 12px;
  border: 1px solid rgba(198, 198, 198, 0.35);
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(0, 0, 0, 0.62) 45%, rgba(150, 170, 200, 0.08));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 20px 50px rgba(0, 0, 0, 0.45);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  overflow: hidden;
}
.idea[hidden] { display: none; }
.idea-row {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 16px;
  align-items: baseline;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-soft);
}
.idea-label {
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a8a8a;
}
.idea-value {
  font-size: 15.5px;
  line-height: 1.45;
  letter-spacing: -0.015em;
  color: #f4f4f4;
}
.idea-row--hook .idea-value {
  font-family: var(--serif);
  font-style: italic;
  font-size: 21px;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: #fff;
}
.idea-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
}
.idea-count { font-size: 12.5px; color: #7a7a7a; letter-spacing: -0.01em; }
.idea-foot .btn { height: 34px; padding: 0 14px; font-size: 13px; }

.idea.flip .idea-value { animation: in-value 0.55s cubic-bezier(0.16, 1, 0.3, 1) both; }
.idea.flip .idea-row:nth-child(2) .idea-value { animation-delay: 0.07s; }
.idea.flip .idea-row:nth-child(3) .idea-value { animation-delay: 0.14s; }

/* ---------- Footer ---------- */
.stats {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 0 var(--stats-x) var(--stats-y);
  padding-bottom: max(var(--stats-y), env(safe-area-inset-bottom));
  color: #d8d8d8;
}
.stat {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-size: var(--stat-size);
  letter-spacing: -0.015em;
  white-space: nowrap;
}
.stat-icon { width: 20px; height: 20px; flex: none; }

/* ---------- Entrance motion ---------- */
.appear {
  opacity: 1;
  animation-duration: 1.05s;
  animation-fill-mode: both;
  animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  animation-delay: var(--d, 0.08s);
}
.appear--scale { animation-name: in-scale; }
.appear--soft  { animation-name: in-soft; }
.appear--mask  { animation-name: in-mask; }
.appear--pop   { animation-name: in-pop; }
.appear--btn   { animation-name: in-btn; }
.appear--stat  { animation-name: in-stat; }
.lede.appear { animation-duration: 1.25s; }
.appear.is-in { animation: none; opacity: 1; transform: none; clip-path: none; filter: none; }

@keyframes in-photo { from { opacity: 0; } to { opacity: 1; } }
@keyframes in-scale { from { opacity: 0; transform: scale(0.84); } to { opacity: 1; transform: scale(1); } }
@keyframes in-soft  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes in-mask  { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: translateY(0); } }
@keyframes in-pop {
  0%   { opacity: 0; transform: scale(0.9); }
  70%  { opacity: 1; transform: scale(1.03); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes in-btn   { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes in-stat  { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes in-star {
  0%   { opacity: 0; transform: scale(0.2) rotate(-50deg); }
  65%  { opacity: 1; transform: scale(1.2) rotate(8deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}
@keyframes in-em { from { opacity: 0.35; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }
@keyframes in-value { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes in-card { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes spin-star { from { transform: rotate(-90deg) scale(0.6); } to { transform: none; } }
.idea.enter { animation: in-card 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .appear, .hero-photo, .hero h1 em, .badge-star { opacity: 1; transform: none; clip-path: none; filter: none; }
}

/* ---------- Responsive ---------- */
@media (min-width: 1600px) {
  :root {
    --logo: 17px; --logo-mark: 24px; --btn: 15px; --btn-h: 44px; --hero-btn-h: 52px;
    --h1: 64px; --lede: 18px; --badge: 13.5px; --stat-size: 15px;
    --header-y: 28px; --header-x: 64px; --stats-x: 96px; --stats-y: 44px;
    --copy-max: 980px; --lede-max: 540px; --card-max: 700px;
  }
  .idea-value { font-size: 17px; }
  .idea-row--hook .idea-value { font-size: 24px; }
  .stat-icon { width: 22px; height: 22px; }
}
@media (min-width: 1920px) {
  :root { --h1: 76px; --lede: 20px; --header-x: 80px; --stats-x: 120px; --card-max: 780px; --copy-max: 1120px; --lede-max: 620px; }
}
@media (min-width: 901px) and (max-width: 1279px) {
  :root { --h1: 42px; --lede: 15px; --header-x: 28px; --stats-x: 36px; --stats-y: 28px; }
}
@media (min-width: 901px) and (max-height: 850px) {
  :root { --header-y: 14px; --stats-y: 22px; --hero-gap: 24px; --h1: 40px; }
  .badge { margin-bottom: 12px; }
  .lede { margin-top: 10px; }
  .hero-actions { margin-top: 16px; }
  .idea { margin-top: 16px; }
  .idea-row { padding: 12px 20px; }
}
@media (min-width: 901px) and (max-height: 720px) {
  :root { --h1: 34px; --lede: 14px; }
  .idea-row--hook .idea-value { font-size: 19px; }
}

/* Phone */
@media (max-width: 900px) {
  :root {
    --logo: 16px; --btn: 15px; --btn-h: 46px; --hero-btn-h: 52px;
    --h1: 36px; --lede: 16.5px; --badge: 13.5px; --stat-size: 15px;
    --header-y: 16px; --header-x: 18px; --stats-x: 20px; --stats-y: 28px;
    --hero-gap: 36px; --copy-max: 100%; --lede-max: 100%; --card-max: 100%;
  }
  .header {
    padding:
      max(var(--header-y), env(safe-area-inset-top))
      max(var(--header-x), env(safe-area-inset-right))
      10px
      max(var(--header-x), env(safe-area-inset-left));
  }
  .header-tags { display: none; }
  .hero { padding: 28px 18px 40px; }
  .idea-row { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; }
  .idea-foot { padding: 12px 16px; }
  .stats { flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .stat { white-space: normal; }
}
@media (max-width: 560px) {
  :root { --h1: 32px; --lede: 16px; --header-x: 16px; }
  .hero-actions, .btn-gen { width: 100%; }
}
</style>
</head>
<body style="background:#000;color:#fff">

<div class="grain" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="grain-noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grain-noise)"/>
  </svg>
</div>

<div class="hero-photo" aria-hidden="true">
  <video autoplay muted loop playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260818_072341_50851634-bbc3-4c33-9acc-7647d4db44aa.mp4"></video>
</div>

<div class="page">
  <header class="header">
    <a class="logo appear appear--scale" href="#top" style="--d:0.08s">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <g transform="rotate(-30 12 12)">
          <circle cx="7.3" cy="3.2" r="1.45"/>
          <rect x="5.5" y="4.7" width="3.6" height="14.6" rx="1.8"/>
          <rect x="14.9" y="4.7" width="3.6" height="14.6" rx="1.8"/>
          <circle cx="16.7" cy="20.8" r="1.45"/>
        </g>
      </svg>
      <span>Reels<span class="logo-suffix">.идеи</span></span>
    </a>
    <div class="header-tags">
      <span class="tag appear appear--scale" style="--d:0.16s">Instagram</span>
      <span class="tag appear appear--soft" style="--d:0.28s">TikTok</span>
      <span class="tag appear appear--scale" style="--d:0.40s">Shorts</span>
    </div>
  </header>

  <main class="hero" id="top">
    <div class="hero-copy">
      <span class="badge appear appear--pop" style="--d:0.22s">
        <svg class="badge-star" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
          <path d="M12 2.6C12.55 2.6 12.88 3.15 13.08 4.7c.62 4.7 1.52 5.6 6.22 6.22 1.55.2 2.1.53 2.1 1.08s-.55.88-2.1 1.08c-4.7.62-5.6 1.52-6.22 6.22-.2 1.55-.53 2.1-1.08 2.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15 12.88 2.6 12.55 2.6 12s.55-.88 2.1-1.08c4.7-.62 5.6-1.52 6.22-6.22C11.12 3.15 11.45 2.6 12 2.6Z"/>
        </svg>
        Генератор идей для рилсов
      </span>

      <h1>
        <span class="headline-line"><span class="appear appear--mask" style="--d:0.42s">Нажми и получи</span></span>
        <span class="headline-line"><span class="appear appear--mask" style="--d:0.62s"><em>идею</em> для рилса.</span></span>
      </h1>

      <p class="lede appear appear--soft" style="--d:0.82s">Тема, хук и формат видео. Полезно для твоего Instagram и TikTok.</p>

      <div class="hero-actions">
        <button class="btn btn-solid btn-gen appear appear--btn" id="gen" type="button" style="--d:0.96s">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.6C12.55 2.6 12.88 3.15 13.08 4.7c.62 4.7 1.52 5.6 6.22 6.22 1.55.2 2.1.53 2.1 1.08s-.55.88-2.1 1.08c-4.7.62-5.6 1.52-6.22 6.22-.2 1.55-.53 2.1-1.08 2.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15 12.88 2.6 12.55 2.6 12s.55-.88 2.1-1.08c4.7-.62 5.6-1.52 6.22-6.22C11.12 3.15 11.45 2.6 12 2.6Z"/>
          </svg>
          <span id="gen-label">Сгенерировать идею</span>
        </button>
      </div>

      <section class="idea" id="idea" hidden aria-live="polite">
        <div class="idea-row">
          <span class="idea-label">Тема</span>
          <span class="idea-value" id="idea-topic"></span>
        </div>
        <div class="idea-row idea-row--hook">
          <span class="idea-label">Хук</span>
          <span class="idea-value" id="idea-hook"></span>
        </div>
        <div class="idea-row">
          <span class="idea-label">Формат</span>
          <span class="idea-value" id="idea-format"></span>
        </div>
        <div class="idea-foot">
          <span class="idea-count" id="idea-count"></span>
          <button class="btn btn-ghost" id="copy" type="button">Скопировать</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="stats">
    <div class="stat appear appear--stat" style="--d:1.12s">
      <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="pill-a" x1="3" y1="2" x2="14" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>

          <linearGradient id="pill-b" x1="3" y1="2" x2="14" y2="22" gradientUnits="userSpaceOnUse" gradientTransform="translate(10 0)">
            <stop offset="0" stop-color="#3a3a3a" stop-opacity="0.38"/>

        <rect x="3.4" y="2.6" width="7.2" height="18.8" rx="3.6" fill="url(#pill-a)"/>
        <rect x="13.4" y="2.6" width="7.2" height="18.8" rx="3.6" fill="url(#pill-b)"/>

      <span id="stat-ideas">Темы для любой ниши</span>

    <div class="stat appear appear--stat" style="--d:1.28s">
      <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.4" y="2.4" width="19.2" height="19.2" rx="6.2" fill="#ffffff"/>
        <g fill="none" stroke="#111" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7.1v7.4"/>
          <path d="M8.15 12.35L12 16.2l3.85-3.85"/>
        </g>
      </svg>
      <span>Хук, который держит первые 3 секунды</span>
    </div>

    <div class="stat appear appear--stat" style="--d:1.44s">
      <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="2.4" width="12" height="19.2" rx="3" fill="none" stroke="#e8e8e8" stroke-width="1.6"/>
        <path d="M10.4 9.2v5.6l4.6-2.8z" fill="#e8e8e8"/>
      </svg>
      <span>Формат под Reels, TikTok и Shorts</span>
    </div>
  </footer>
</div>

<script>
(function () {
  // ---------- Ideas ----------
  var IDEAS = [
    ["3 ошибки, которые делают новички в твоей нише", "«Если ты делаешь это, ты теряешь клиентов каждый день»"],
    ["Один твой рабочий день за 30 секунд", "«Вот как на самом деле выглядит мой рабочий день»"],
    ["Миф и правда о твоей профессии", "«Все в это верят. Но это неправда»"],
    ["Приложение или инструмент, который экономит тебе час в день", "«Жаль, что я не нашёл это год назад»"],
    ["Твой результат: что было месяц назад и что сейчас", "«Месяц назад у меня было вот так…»"],
    ["Ответ на самый частый вопрос подписчиков", "«Мне задают этот вопрос каждый день. Отвечаю раз и навсегда»"],
    ["Совет себе годичной давности", "«Если бы я мог вернуться на год назад, я бы сказал себе одно»"],
    ["Самая дорогая ошибка в твоём деле", "«Эта ошибка обошлась мне очень дорого»"],
    ["Лайфхак, который занимает 10 секунд", "«Сохрани, пока не забыл»"],
    ["Непопулярное мнение о твоей нише", "«Сейчас меня будут хейтить, но…»"],
    ["Разбор вирусного видео: почему оно залетело", "«Почему это видео набрало миллион? Разбираю за 30 секунд»"],
    ["Закулисье: как создаётся твой продукт или услуга", "«Вы никогда не видели, как это делается»"],
    ["Чек-лист из 5 пунктов перед стартом", "«Не начинай, пока не проверишь эти 5 пунктов»"],
    ["Твоё мнение о новом тренде в нише", "«Все сейчас это делают. А стоит ли?»"],
    ["Ответ на хейтерский комментарий", "«Мне написали это в комментариях. Отвечаю»"],
    ["Дешёвый и дорогой вариант: есть ли разница", "«Дешёвое против дорогого. Угадаешь, где что?»"],
    ["Первый шаг для полного новичка", "«Хочешь начать, но не знаешь с чего? Вот первый шаг»"],
    ["Твоя утренняя рутина", "«Мои первые 30 минут после пробуждения»"],
    ["Реальные цифры: сколько потратил и сколько получил", "«Показываю цифры, которые обычно скрывают»"],
    ["Привычка, от которой ты отказался", "«Я перестал это делать, и всё изменилось»"],
    ["Челлендж на 7 дней и его итог", "«Я делал это 7 дней подряд. Вот что произошло»"],
    ["Топ-3 книги, курса или сервиса для твоей ниши", "«Три вещи, которые реально изменили мой подход»"],
    ["Как сделать что-то полезное за 60 секунд", "«Засекай минуту»"],
    ["Признание: в чём ты был не прав", "«Я долго вам это советовал. Я ошибался»"],
    ["Ожидание и реальность в твоей профессии", "«Как я думал, будет. И как оказалось»"],
    ["Секрет, о котором молчат профессионалы", "«Профи не любят об этом говорить»"],
    ["История провала и что он тебе дал", "«Это был мой худший день в работе»"],
    ["Сколько на самом деле стоит то, чем ты занимаешься", "«Сколько это стоит на самом деле? Считаю честно»"],
    ["Пошаговый мини-туториал", "«Повтори за мной. Всего 3 шага»"],
    ["Как всё начиналось: твоя история", "«Всё началось с одного сообщения»"],
    ["Типы клиентов или людей в твоей нише", "«Узнай себя: какой ты тип?»"],
    ["Что лежит у тебя на рабочем столе или в сумке", "«Без этих вещей я не начинаю работу»"],
    ["Худший совет, который ты слышал в своей нише", "«Худший совет, который мне давали. Не повторяйте»"],
    ["Опрос аудитории одним словом", "«Ответь в комментариях одним словом»"],
    ["Популярный совет, который на самом деле вредит", "«Этот совет набрал миллионы просмотров. И он вредный»"],
    ["Как перестать переплачивать в твоей нише", "«Перестань переплачивать за это»"],
    ["Быстрый обзор новинки", "«Вышло на этой неделе. Стоит ли брать?»"],
    ["Распаковка или первое впечатление", "«Открываем вместе. Я сам ещё не видел»"],
    ["Публичная цель на месяц", "«Записываю это, чтобы не слиться»"],
    ["Сравнение: как делают все и как делаешь ты", "«Все делают так. А я делаю вот так»"],
    ["Вопрос, который тебе стыдно было задать в начале", "«Я стеснялся спросить это, когда начинал»"],
    ["3 признака, что пора что-то менять", "«Если узнал себя хотя бы в одном пункте, досмотри»"],
    ["Реакция на старое своё видео", "«Смотрю своё первое видео. Это больно»"],
    ["Одна вещь, которая дала тебе больше всего результата", "«80% результата мне дала одна вещь»"],
    ["Что бы ты сделал, если бы начинал с нуля сегодня", "«Если бы я начинал с нуля сегодня, я бы сделал так»"]
  ];
  var FORMATS = [
    "Говорящая голова, 15–25 сек, крупные субтитры",
    "Текст на экране + трендовый звук, 7–10 сек",
    "POV-сценка, 10–15 сек",
    "До / после с резкой склейкой на бит",
    "Список из 3 пунктов, цифры на экране, 20–30 сек",
    "Запись экрана телефона + голос за кадром",
    "Голос за кадром + нарезка B-roll, 20 сек",
    "Диалог с самим собой: два образа, 15–20 сек",
    "Зелёный экран: ты на фоне скриншота или видео",
    "Таймлапс процесса + подписи",
    "Ответ на комментарий: стикер комментария сверху",
    "Быстрые склейки каждые 1–2 сек, 15–20 сек",
    "Сторителлинг в один дубль, 30–45 сек",
    "Карусель в видео: 5 кадров с текстом по 2 сек"
  ];

  var gen = document.getElementById('gen');
  var genLabel = document.getElementById('gen-label');
  var card = document.getElementById('idea');
  var elTopic = document.getElementById('idea-topic');
  var elHook = document.getElementById('idea-hook');
  var elFormat = document.getElementById('idea-format');
  var elCount = document.getElementById('idea-count');
  var copyBtn = document.getElementById('copy');

  document.getElementById('stat-ideas').textContent = IDEAS.length + ' тем для любой ниши';

  // Shuffled deck so ideas don't repeat until all are shown.
  var deck = [];
  var lastFormat = -1;
  var shown = 0;
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function nextIdea() {
    if (!deck.length) deck = shuffle(IDEAS.map(function (_, i) { return i; }));
    return IDEAS[deck.pop()];
  }
  function nextFormat() {
    var f;
    do { f = Math.floor(Math.random() * FORMATS.length); } while (f === lastFormat && FORMATS.length > 1);
    lastFormat = f;
    return FORMATS[f];
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  gen.addEventListener('click', function () {
    var idea = nextIdea();
    elTopic.textContent = idea[0];
    elHook.textContent = idea[1];
    elFormat.textContent = nextFormat();
    shown++;
    elCount.textContent = 'Идея №' + shown;
    copyBtn.textContent = 'Скопировать';

    if (card.hidden) {
      card.hidden = false;
      restart(card, 'enter');
    }
    restart(card, 'flip');
    restart(gen, 'spin');
    genLabel.textContent = 'Ещё идею';
  });

  copyBtn.addEventListener('click', function () {
    var text = 'Тема: ' + elTopic.textContent + '\nХук: ' + elHook.textContent + '\nФормат: ' + elFormat.textContent;
    function ok() { copyBtn.textContent = 'Скопировано ✓'; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  // ---------- Entrance motion ----------
  var animated = Array.prototype.slice.call(document.querySelectorAll('.appear, .hero-photo'));
  animated.forEach(function (el) {
    function done(e) {
      if (e.target !== el) return;
      el.classList.add('is-in');
      el.removeEventListener('animationend', done);
    }
    el.addEventListener('animationend', done);
  });
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      var running = animated.some(function (el) {
        if (typeof el.getAnimations !== 'function') return false;
        return el.getAnimations().some(function (a) {
          return a.playState === 'running' || a.playState === 'finished';
        });
      });
      if (!running) animated.forEach(function (el) { el.classList.add('is-in'); });
    });
  });
})();
</script>
</body>
</html>
